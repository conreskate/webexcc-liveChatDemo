    <title>Webex Contact Center Demo</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;

        /* Login screen */
        #loginScreen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }

        #loginScreen h2 {
            margin-bottom: 20px;
        }

        #password {
            padding: 12px;
            width: 220px;
            font-size: 16px;
            margin-bottom: 12px;
        }

        #loginScreen button {
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
        }

        #error {
            color: red;
            margin-top: 10px;
        }

        /* Main page */
        #mainContent {
            display: none;
        }

        header {
            background-color: #1d2d50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .heroImage {
            min-height: 500px;
            background-image: url("background2.jpg");
            background-size: cover;
            background-position: center;
            position: relative;
            padding: 20px;
        }

        /* Chat widget container */
        #chatWidgetContainer {
            display: none;
        }
    </style>
</head>

<body>

    <!-- LOGIN SCREEN -->
    <div id="loginScreen">
        <h2>Webex Contact Center Demo</h2>

        <input
            type="password"
            id="password"
            placeholder="Enter password"
            onkeydown="if(event.key === 'Enter') checkPassword()"
        >

        <button onclick="checkPassword()">Login</button>

        <div id="error"></div>
    </div>

        <div class="heroImage">

    <script>

        // ==========================================
        // LOGIN SETTINGS
        // ==========================================

        const PASSWORD = "Demo123!";

        // ==========================================
        // CHAT WIDGET SETTINGS
        // ==========================================

        let imiWidgetStarted = false;
        let imiWidgetLoaded = false;

        const chatContainer = document.getElementById(
            "chatWidgetContainer"
        );

        // ==========================================
        // LOGIN FUNCTION
        // ==========================================

        function checkPassword() {

            const entered = document.getElementById("password").value;

            if (entered === PASSWORD) {

                document.getElementById("loginScreen").style.display = "none";

                document.getElementById("mainContent").style.display = "block";

                // Check whether the chat widget should be visible.
                updateChatWidgetVisibility();

            } else {

                document.getElementById("error").innerHTML =
                    "Incorrect password.";

            }
        }
  // ==========================================
        // LOAD IMI CHAT WIDGET
        // ==========================================

        function loadImiWidget() {

            // Prevent loading the widget more than once.
            if (imiWidgetStarted) {
                return;
            }

            imiWidgetStarted = true;

            const widgetDiv = document.getElementById("divicw");

            // Load the Cisco/IMI initialization script.
            const script = document.createElement("script");

            script.src =
                "https://media.imi.chat/widget/js/imichatinit.js?t=" +
                new Date().getTime();

            script.onload = function () {

                imiWidgetLoaded = true;

                console.log("IMI chat widget loaded successfully.");

            };

            script.onerror = function () {

                console.error("Unable to load the IMI chat widget.");

                imiWidgetStarted = false;

            };

            // Insert the script immediately after the widget div.
            widgetDiv.parentNode.insertBefore(
                script,
                widgetDiv.nextSibling
            );
        }

        // ==========================================
        // EVEN / ODD HOUR VISIBILITY
        // ==========================================

        function updateChatWidgetVisibility() {

            const mainPage = document.getElementById("mainContent");

            // Never show or load the widget before login.
            if (mainPage.style.display === "none") {

                chatContainer.style.display = "none";

                return;
            }

            // Get the current local hour (0-23).
            const currentHour = new Date().getHours();

            console.log("Current hour:", currentHour);

            if (currentHour % 2 === 0) {

                // EVEN HOUR: SHOW CHAT WIDGET
                console.log("Even hour - showing chat widget.");

                chatContainer.style.display = "block";

                // Load the widget only once.
                loadImiWidget();

            } else {

                // ODD HOUR: HIDE CHAT WIDGET
                console.log("Odd hour - hiding chat widget.");

                chatContainer.style.display = "none";

            }
        }


        // ==========================================
        // AUTOMATIC VISIBILITY CHECK
        // ==========================================

        // Check every 30 seconds.
        setInterval(function () {

            updateChatWidgetVisibility();

        }, 30000);

    </script>
